<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Preview</title>
    
    <!-- Meta tag Open Graph untuk preview kartu saat link dikirim di WhatsApp -->
    <meta property="og:title" content="Loyz WhatsApp Bot" />
    <meta property="og:description" content="Preview Bot WhatsApp" />
    <meta property="og:image" content="https://0xloyz.github.io/bot/preview.png" />
    <meta property="og:url" content="https://0xloyz.github.io/bot/" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Menampilkan hanya gambar preview.png -->
    <img src="preview.png" alt="Preview Bot" onerror="this.src='https://via.placeholder.com/600x400/0f172a/38bdf8?text=preview.png+tidak+ditemukan'">

</body>
</html>
